<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>City Map Coaster Studio — SVG for laser engraving</title>
    <meta
      name="description"
      content="Design a street-map coaster from any city or address and export a millimetre-accurate SVG for xTool, LightBurn and other laser cutters."
    />
    <link rel="stylesheet" href="src/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%233a3f43'/%3E%3Cg stroke='%23efece6' stroke-width='1.6' fill='none'%3E%3Cpath d='M4 11h24M4 21h24M11 4v24M21 4v24'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='4.5' fill='%23efece6'/%3E%3C/svg%3E"
    />
    <script src="vendor/opentype.min.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="7" fill="currentColor" opacity="0.12" />
          <g stroke="currentColor" stroke-width="1.5" fill="none" opacity="0.75">
            <path d="M4 11h24M4 21h24M11 4v24M21 4v24" />
          </g>
          <circle cx="16" cy="16" r="4.2" fill="currentColor" />
        </svg>
        <div>
          <h1>City Map Coaster Studio</h1>
          <p>Street maps to laser-ready SVG</p>
        </div>
      </div>
      <p class="topbar-note">
        Everything runs in this browser. Map data © OpenStreetMap contributors (ODbL).
      </p>
    </header>

    <main class="layout">
      <section class="stage" id="stage">
        <div class="stage-inner">
          <div class="preview-frame">
            <div class="preview" id="preview" role="img" aria-label="Coaster preview"></div>
            <div class="busy" id="busy" aria-live="polite"></div>
          </div>
          <p class="status" id="status" role="status" aria-live="polite"></p>
          <p class="stage-hint">
            Drag to pan · scroll to zoom · the preview is the exported artwork at 1:1
          </p>
        </div>
      </section>

      <aside class="sidebar" id="panel" aria-label="Design controls"></aside>
    </main>

    <noscript>
      <p class="noscript">This tool needs JavaScript — it builds the map entirely in your browser.</p>
    </noscript>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
